---
# Copyright (c) 2024, NVIDIA CORPORATION.

ci:
  autoupdate_schedule: quarterly
  # These hooks require tools unavailable in pre-commit.ci:
  #
  #   * actionlint-docker requires Docker
  #   * release-build-output-config requires jq
  #
  # Both run in other CI jobs with controlled runtime dependencies.
  skip: [actionlint-docker, release-build-output-config]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix", "--config=pyproject.toml"]
      - id: ruff-format
        args: ["--config=pyproject.toml"]
  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v1.6.1
    hooks:
      - id: verify-copyright
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.0'
    hooks:
      - id: mypy
        additional_dependencies:
          - "requests>=2.32.4"
          - "types-requests>=2.32.4"
        args:
          - "--config-file=pyproject.toml"
          - "check_nightly_success/"
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        additional_dependencies: [pyyaml]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-jsonschema
        name: validate release build-output config schema fixtures
        args: [--schemafile, release-build-output/config.schema.json]
        files: ^tests/release-build-output-config/.*\.json$
  - repo: local
    hooks:
      - id: release-build-output-config
        name: validate release build-output configuration
        entry: ./tests/release_build_output_config_test.sh
        language: system
        pass_filenames: false
        files: ^(release-build-output/(config\.schema\.json|validate-config\.sh)|tests/release_build_output_config_test\.sh)$
