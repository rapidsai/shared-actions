name: Plan release-candidate row reuse
description: >-
  Decide every build row of a release run before any build job starts, CI images first: bind the rows an earlier
  complete run can supply, and output each job's matrix of rows that must build and the image map
  (plans/per-row-reuse.md, 4a and 4b). With mode apply, the rows were decided when the train was planned (4c): the
  run re-checks and binds the train's recorded hits instead of computing keys.

inputs:
  mode:
    description: >-
      run: decide every row in this run. apply: re-check and bind the reuse plan Create/Update Train recorded for
      the train (reuse_plan.py --mode train); a train without one, or planned for another manifest, stops the run.
    required: false
    default: run
  manifest:
    description: >-
      JSON written by the release-file generator: schema_version 1 and the build jobs, each with id, repository,
      project, unit, family, entrypoint, identity (its static with: values), needs and matrix. A CI image job
      (family container) needs no job and its matrix is the image matrix.
    required: true
  image-map:
    description: >-
      JSON object, candidate image key -> digest-pinned candidate image, for images not decided by this plan
      (verify-ci-imgs' image map); "{}" when the manifest lists the image job.
    required: false
    default: "{}"
  candidate-train-sha256:
    description: Canonical SHA-256 of the immutable release train.
    required: true
  candidate-bucket:
    description: Private S3 bucket holding the candidate store.
    required: false
    default: rapids-release-candidates
  candidate-train-prefix:
    description: Root prefix for train records.
    required: false
    default: train-state
  candidate-content-prefix:
    description: Root prefix for content-addressed artifacts and the row reuse index.
    required: false
    default: artifacts

outputs:
  matrices:
    description: JSON object, job id -> the matrix of its rows that build. Jobs whose rows were all reused are absent.
    value: ${{ steps.plan.outputs.matrices }}
  reused-jobs:
    description: JSON list of the jobs whose every row was reused; the release file skips them.
    value: ${{ steps.plan.outputs.reused-jobs }}
  image-map:
    description: >-
      JSON object, candidate image key -> digest-pinned GHCR image: the given image map plus every image this plan
      reused. When every image was reused, package jobs read it instead of verify-ci-imgs' map.
    value: ${{ steps.plan.outputs.image-map }}

runs:
  using: composite
  steps:
    - name: Require the plan's tools on this runner
      shell: bash
      run: |
        set -euo pipefail
        # S3 goes through boto3 in-process (s3_boto.py); jq and bash run the shared key scripts.
        for tool in jq python3; do
          if ! command -v "${tool}" >/dev/null; then
            echo "candidate-reuse-plan needs ${tool} on the runner; run it on a runner that has jq and python3" >&2
            exit 1
          fi
        done
    - name: Name the plan's environment
      id: environment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ "${MODE}" != run && "${MODE}" != apply ]]; then
          echo "candidate-reuse-plan mode must be run or apply, not ${MODE}" >&2
          exit 1
        fi
        # The environment is cached by this Python and the hash-pinned requirements, so a run restores it in about a
        # second instead of installing boto3 (about 6 s, release run 45892215679).
        python="$(python3 -c 'import platform, sys; print(platform.python_implementation() + "-" + platform.python_version() + "-" + sys.executable)' | sha256sum | cut -c1-16)"
        requirements="$(sha256sum "${ACTION_PATH}/requirements.txt" | cut -c1-16)"
        {
          printf 'path=%s\n' "${RUNNER_TEMP:?}/candidate-reuse-plan-venv"
          printf 'key=candidate-reuse-plan-venv-v1-%s-%s-%s-%s\n' "${RUNNER_OS:?}" "${RUNNER_ARCH:?}" "${python}" "${requirements}"
        } >> "${GITHUB_OUTPUT}"
    - name: Restore the plan's environment
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.environment.outputs.path }}
        key: ${{ steps.environment.outputs.key }}
    - name: Install the plan's pinned dependency
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ENVIRONMENT: ${{ steps.environment.outputs.path }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [[ "${CACHE_HIT}" != true ]]; then
          python3 -m venv "${ENVIRONMENT}"
          "${ENVIRONMENT}/bin/python" -m pip install --quiet --no-deps --require-hashes \
            -r "${ACTION_PATH}/requirements.txt"
        fi
        # A restored environment must hold exactly the pinned packages, or the plan doesn't run on it.
        "${ENVIRONMENT}/bin/python" -m pip install --quiet --no-deps --require-hashes --no-index --dry-run \
          -r "${ACTION_PATH}/requirements.txt" > /dev/null 2>&1 || {
          echo "the restored plan environment does not match requirements.txt; reinstalling" >&2
          rm -rf "${ENVIRONMENT}"
          python3 -m venv "${ENVIRONMENT}"
          "${ENVIRONMENT}/bin/python" -m pip install --quiet --no-deps --require-hashes \
            -r "${ACTION_PATH}/requirements.txt"
        }
        "${ENVIRONMENT}/bin/python" -c 'import boto3, botocore'
        printf 'python=%s\n' "${ENVIRONMENT}/bin/python" >> "${GITHUB_OUTPUT}"
    - name: Decide every row
      id: plan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REUSE_PLAN_PYTHON: ${{ steps.install.outputs.python }}
        MODE: ${{ inputs.mode }}
        MANIFEST: ${{ inputs.manifest }}
        IMAGE_MAP: ${{ inputs.image-map }}
        TRAIN_SHA256: ${{ inputs.candidate-train-sha256 }}
        BUCKET: ${{ inputs.candidate-bucket }}
        TRAIN_PREFIX: ${{ inputs.candidate-train-prefix }}
        CONTENT_PREFIX: ${{ inputs.candidate-content-prefix }}
      run: |
        set -euo pipefail
        manifest="$(mktemp)"
        trap 'rm -f "${manifest}"' EXIT
        printf '%s' "${MANIFEST}" > "${manifest}"
        "${REUSE_PLAN_PYTHON:?}" -u "${ACTION_PATH}/../release-candidate-dependencies/reuse_plan.py" \
          --mode "${MODE}" \
          --manifest "${manifest}" \
          --image-map "${IMAGE_MAP}" \
          --train-sha256 "${TRAIN_SHA256}" \
          --run-id "${GITHUB_RUN_ID:?}" \
          --run-attempt "${GITHUB_RUN_ATTEMPT:?}" \
          --bucket "${BUCKET}" \
          --train-prefix "${TRAIN_PREFIX}" \
          --content-prefix "${CONTENT_PREFIX}" \
          --github-output "${GITHUB_OUTPUT}" \
          --summary "${GITHUB_STEP_SUMMARY}" \
          --server-url "${GITHUB_SERVER_URL:?}" \
          --repository "${GITHUB_REPOSITORY:?}"
