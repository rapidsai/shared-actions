name: Resolve release-candidate run context
description: Resolve an immutable controller binding without adding project workflow inputs.
inputs:
  source-sha:
    description: Full source SHA checked out for this build.
    required: true
  script:
    description: Custom job script requiring a centrally reviewed policy; empty for standard builds.
    default: ''
  audit-boundary:
    description: Probe private candidate policy boundaries after resolving this exact controller binding.
    default: 'false'
outputs:
  train-sha256:
    description: Exact release train bound to this workflow run.
    value: ${{ steps.resolve.outputs.train-sha256 }}
  custom-mode:
    description: Build, test, or intermediate artifact policy.
    value: ${{ steps.resolve.outputs.custom-mode }}
runs:
  using: composite
  steps:
    - name: Locate context resolver in the job container
      id: implementation
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST_WORKSPACE: ${{ github.workspace }}
      run: |
        host_root="$(dirname "$(dirname "${HOST_WORKSPACE}")")"
        container_root="$(dirname "$(dirname "${PWD}")")"
        action_path="${ACTION_PATH}"
        if [[ ! -d "${action_path}" && "${action_path}" == "${host_root}/"* ]]; then
          action_path="${container_root}/${action_path#"${host_root}/"}"
        fi
        test -f "${action_path}/resolver.py"
        echo "path=${action_path}" >> "${GITHUB_OUTPUT}"
    - name: Resolve exact run binding
      id: resolve
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        CUSTOM_SCRIPT: ${{ inputs.script }}
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python_bin=python3
        elif command -v python >/dev/null 2>&1 && python -c 'import sys; raise SystemExit(sys.version_info.major != 3)' >/dev/null 2>&1; then
          python_bin=python
        else
          echo "Python 3 is required to resolve the release-candidate run binding" >&2
          exit 1
        fi
        "${python_bin}" "${IMPLEMENTATION_PATH}/resolver.py" --source-sha "${SOURCE_SHA}" --script "${CUSTOM_SCRIPT}"
    - name: Audit private workload boundaries
      if: ${{ inputs.audit-boundary == 'true' }}
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        TRAIN_SHA256: ${{ steps.resolve.outputs.train-sha256 }}
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python_bin=python3
        elif command -v python >/dev/null 2>&1 && python -c 'import sys; raise SystemExit(sys.version_info.major != 3)' >/dev/null 2>&1; then
          python_bin=python
        else
          echo "Python 3 is required for the private workload boundary audit" >&2
          exit 1
        fi
        "${python_bin}" "${IMPLEMENTATION_PATH}/boundary_probe.py" --source-sha "${SOURCE_SHA}" --train-sha256 "${TRAIN_SHA256}"
