name: Prepare release-candidate dependencies
description: Materialize only this release train's private S3 outputs for a candidate build.

inputs:
  candidate-train-sha256:
    description: Canonical SHA-256 of the immutable release train.
    required: true
  candidate-bucket:
    description: Private S3 bucket holding candidate build bundles.
    required: false
    default: rapids-release-candidates
  candidate-train-prefix:
    description: Root prefix for immutable candidate train membership records.
    required: false
    default: train-state
  prepare-conda-channel:
    description: Whether this job needs a local Conda channel for build dependencies.
    required: false
    default: "false"
  artifact-family:
    description: Release-unit family that this job is building; docs and containers resolve declared Conda and Maven prerequisites.
    required: true
  candidate-unit-id:
    description: Exact release-train unit ID when it differs from <artifact-family>:<repository>.
    required: false
    default: ""
  implementation-mode:
    description: Whether this action runs through the frozen reusable workflow or directly in the producer workflow.
    required: false
    default: reusable
  arch:
    description: Canonical RAPIDS architecture for this job matrix.
    required: true
  cuda-version:
    description: CUDA version for this job matrix.
    required: true
  python-version:
    description: Python version for this job matrix.
    required: false
  image-preflight-file:
    description: Optional controller image-preflight JSON to bind into this job's BuildInput.
    required: false
    default: ""
  consumer-id:
    description: Exact consumer ID selected by the controller image preflight; required with image-preflight-file.
    required: false
    default: ""
  runtime-image-reference:
    description: Immutable repository@sha256 image reference used by this consumer job; required with image-preflight-file.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: implementation
      name: Resolve candidate dependency implementation
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST_WORKSPACE: ${{ github.workspace }}
      run: |
        host_root="$(dirname "$(dirname "${HOST_WORKSPACE}")")"
        container_root="$(dirname "$(dirname "${PWD}")")"
        action_path="${ACTION_PATH}"
        if [[ ! -d "${action_path}" && "${action_path}" == "${host_root}/"* ]]; then
          action_path="${container_root}/${action_path#"${host_root}/"}"
        fi
        if [[ ! -f "${action_path}/setup.sh" ]]; then
          echo "release-candidate dependency implementation not found at ${action_path}" >&2
          exit 1
        fi
        echo "path=${action_path}" >>"${GITHUB_OUTPUT}"
    - name: Prepare private candidate dependency views
      shell: bash
      env:
        RELEASE_CANDIDATE_BUCKET: ${{ inputs.candidate-bucket }}
        RELEASE_CANDIDATE_TRAIN_PREFIX: ${{ inputs.candidate-train-prefix }}
        RELEASE_CANDIDATE_TRAIN_SHA256: ${{ inputs.candidate-train-sha256 }}
        RELEASE_CANDIDATE_PREPARE_CONDA_CHANNEL: ${{ inputs.prepare-conda-channel }}
        RELEASE_CANDIDATE_ARTIFACT_FAMILY: ${{ inputs.artifact-family }}
        RELEASE_CANDIDATE_UNIT_ID: ${{ inputs.candidate-unit-id }}
        RELEASE_CANDIDATE_IMPLEMENTATION_MODE: ${{ inputs.implementation-mode }}
        RELEASE_CANDIDATE_ARCH: ${{ inputs.arch }}
        RELEASE_CANDIDATE_CUDA_VERSION: ${{ inputs.cuda-version }}
        RELEASE_CANDIDATE_PYTHON_VERSION: ${{ inputs.python-version }}
        RELEASE_CANDIDATE_IMAGE_PREFLIGHT_FILE: ${{ inputs.image-preflight-file }}
        RELEASE_CANDIDATE_CONSUMER_ID: ${{ inputs.consumer-id }}
        RELEASE_CANDIDATE_RUNTIME_IMAGE_REFERENCE: ${{ inputs.runtime-image-reference }}
        RELEASE_CANDIDATE_SHARED_ACTIONS_REPOSITORY: ${{ github.action_repository }}
        RELEASE_CANDIDATE_SHARED_ACTIONS_REVISION: ${{ github.action_ref }}
        RELEASE_CANDIDATE_SHARED_WORKFLOWS_REPOSITORY: ${{ job.workflow_repository }}
        RELEASE_CANDIDATE_SHARED_WORKFLOWS_REVISION: ${{ job.workflow_sha }}
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
      run: ${IMPLEMENTATION_PATH}/setup.sh
