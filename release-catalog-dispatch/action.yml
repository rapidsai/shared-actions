name: Dispatch release catalog
description: Create a release catalog companion from the selected shared-actions revision.

inputs:
  config:
    description: >-
      JSON string with configuration for this action. Schema and field documentation:
      https://github.com/rapidsai/shared-actions/blob/main/release-catalog/config.schema.json
    required: true
  source-artifact-name:
    description: Name of the GitHub Actions artifact bundle containing this output.
    required: true
  source-sha:
    description: Source revision built by the producing job.
    required: false

outputs:
  entries-path:
    description: Absolute path to the generated release catalog entries.
    value: ${{ steps.materialize.outputs.entries-path }}
  companion-artifact-name:
    description: Name of the uploaded GitHub Actions companion artifact.
    value: ${{ steps.companion-name.outputs.name }}

runs:
  using: composite
  steps:
    - id: implementation
      name: Resolve release catalog implementation
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST_WORKSPACE: ${{ github.workspace }}
      run: |
        host_root="$(dirname "$(dirname "${HOST_WORKSPACE}")")"
        container_root="$(dirname "$(dirname "${PWD}")")"
        action_path="${ACTION_PATH}"
        if [[ ! -d "${action_path}" && "${action_path}" == "${host_root}/"* ]]; then
          action_path="${container_root}/${action_path#"${host_root}/"}"
        fi
        implementation_path="$(dirname "${action_path}")/release-catalog"
        if [[ ! -d "${implementation_path}" ]]; then
          echo "release-catalog implementation not found at ${implementation_path}" >&2
          exit 1
        fi
        echo "path=${implementation_path}" >>"${GITHUB_OUTPUT}"
    - id: configuration
      name: Validate release catalog configuration
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        RELEASE_CATALOG_CONFIG: ${{ inputs.config }}
      run: "${IMPLEMENTATION_PATH}/validate-config.sh"
    - id: prepare
      name: Describe release artifacts
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        RELEASE_ARTIFACTS: ${{ steps.configuration.outputs.artifacts }}
        RELEASE_ARTIFACT_TYPE: ${{ steps.configuration.outputs.artifact_type }}
        RELEASE_OUTPUT_DIRECTORY: ${{ steps.configuration.outputs.output_directory }}
        RELEASE_PACKAGE: ${{ steps.configuration.outputs.package }}
        RELEASE_PACKAGE_FILE: ${{ steps.configuration.outputs.package_file }}
      run: "${IMPLEMENTATION_PATH}/prepare.sh"
    - id: materialize
      name: Materialize release catalog entries
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        RELEASE_ARTIFACTS: ${{ steps.prepare.outputs.artifacts }}
        RELEASE_ENTRIES_NAME: release-catalog-entries.json
        RELEASE_OUTPUT_DIRECTORY: ${{ steps.configuration.outputs.output_directory }}
        RELEASE_PACKAGE: ${{ steps.prepare.outputs.package }}
        RELEASE_PACKAGE_FILE: ${{ steps.configuration.outputs.package_file }}
        RELEASE_SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
        RELEASE_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
        RELEASE_CATALOG_KEY: ${{ steps.configuration.outputs.release_catalog_key }}
      run: "${IMPLEMENTATION_PATH}/materialize.sh"
    - id: companion-name
      name: Set companion artifact name
      shell: bash
      env:
        SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
      run: echo "name=release-catalog-${SOURCE_ARTIFACT_NAME}" >>"${GITHUB_OUTPUT}"
    - name: Upload release catalog companion
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: error
        name: ${{ steps.companion-name.outputs.name }}
        path: |
          ${{ steps.configuration.outputs.output_directory }}/release-catalog-entries.json
          ${{ steps.configuration.outputs.output_directory }}/release-evidence/**
