name: Dispatch release catalog
description: Create a release catalog companion from the selected shared-actions revision.

inputs:
  config:
    description: >-
      JSON string with configuration for this action. Schema and field documentation:
      https://github.com/rapidsai/shared-actions/blob/main/release-catalog/config.schema.json
    required: true
  source-artifact-name:
    description: Name of the existing GitHub Actions artifact whose files are being cataloged.
    required: true
runs:
  using: composite
  steps:
    - id: implementation
      name: Resolve release catalog implementation
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOST_WORKSPACE: ${{ github.workspace }}
      run: |
        host_root="$(dirname "$(dirname "${HOST_WORKSPACE}")")"
        container_root="$(dirname "$(dirname "${PWD}")")"
        action_path="${ACTION_PATH}"
        if [[ ! -d "${action_path}" && "${action_path}" == "${host_root}/"* ]]; then
          action_path="${container_root}/${action_path#"${host_root}/"}"
        fi
        implementation_path="$(dirname "${action_path}")/release-catalog"
        if [[ ! -d "${implementation_path}" ]]; then
          echo "release-catalog implementation not found at ${implementation_path}" >&2
          exit 1
        fi
        echo "path=${implementation_path}" >>"${GITHUB_OUTPUT}"
    - id: configuration
      name: Validate release catalog configuration
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        RELEASE_CATALOG_CONFIG: ${{ inputs.config }}
      run: "${IMPLEMENTATION_PATH}/validate-config.sh"
    - name: Materialize release catalog entries
      shell: bash
      env:
        IMPLEMENTATION_PATH: ${{ steps.implementation.outputs.path }}
        RELEASE_ARTIFACTS: ${{ steps.configuration.outputs.artifacts }}
        RELEASE_ENTRIES_NAME: release-catalog-entries.json
        RELEASE_ARTIFACT_DIRECTORY: ${{ steps.configuration.outputs.artifact_directory }}
        RELEASE_SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
        RELEASE_CATALOG_KEY: ${{ steps.configuration.outputs.release_catalog_key }}
      run: "${IMPLEMENTATION_PATH}/materialize.sh"
    - name: Upload release catalog companion
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: error
        name: release-catalog-${{ inputs.source-artifact-name }}
        path: |
          ${{ steps.configuration.outputs.artifact_directory }}/release-catalog-entries.json
          ${{ steps.configuration.outputs.artifact_directory }}/release-evidence/**
